<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Destiny Number Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../assets/css/core/forms.css" />
<link rel="stylesheet" href="../assets/css/numerology/base.css" />
</head>

<body>

<div class="container">
  <h1 class="page-title">Destiny Number Calculator</h1>
  <p class="page-subtitle">What your full birth name reveals about your life's work</p>

  <div class="form-card" id="calc-form"></div>
  <div class="error-output"></div>

  <div class="result-wrap destiny-container display-none">
    <div class="result-card">
      <div class="output-personal-date"></div>
      <hr class="section-divider" />

      <h2 class="section-title tight">Your Destiny Number</h2>
      <div class="result-number-display">
        <p class="num-value" id="num-value"></p>
      </div>
      <hr class="section-divider" />

      <h2 class="section-title">Calculation Process</h2>
      <div class="process-card" id="process-lines"></div>
      <hr class="section-divider" />

      <h2 class="section-title">What Your Destiny Number Reveals</h2>
      <div class="interpretation-card" id="interpretation"></div>
    </div>
  </div>
</div>

<script src="../assets/js/core/forms.js"></script>
<script src="../assets/js/numerology/calculations.js"></script>
<script src="../assets/js/numerology/destiny-number-data.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   CALCULATION PROCESS RENDER
   Per-letter values (plain comma list) -> reduction chain of the
   total -> final Destiny Number, in the exact plain-text format used
   by the other calculators in this silo.
   ════════════════════════════════════════════════════════════════════ */

function calculateAndRender(name) {
  const { total, breakdown } = computeNameNumber(name);

  const letterValuesText = breakdown
    .map((entry) => `${entry.letter.toUpperCase()}=${entry.value}`)
    .join(', ');

  const totalSteps = reduceKeepingMasterWithSteps(total);
  const destinyNumber = totalSteps[totalSteps.length - 1];

  const lines = [
    `<p class="process-line"><span class="process-label">Letter values:</span> ${escapeHtml(letterValuesText)}</p>`,
    `<p class="process-line"><span class="process-label">Reduction:</span> ${breakdown.map((entry) => entry.value).join('+')} <span class="process-arrow">&#8594;</span> ${totalSteps.join(' <span class="process-arrow">&#8594;</span> ')}</p>`,
    `<p class="process-line process-final">Destiny Number: ${formatDisplayNumber(destinyNumber)}</p>`,
  ];
  document.getElementById('process-lines').innerHTML = lines.join('');

  document.getElementById('num-value').textContent = formatDisplayNumber(destinyNumber);

  const entry = DESTINY_NUMBER_DATA[destinyNumber];
  const interpEl = document.getElementById('interpretation');
  if (entry) {
    interpEl.innerHTML = `<p><strong>${escapeHtml(entry.title)}</strong></p>` +
      entry.paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join('');
  } else {
    interpEl.innerHTML = `<p>This reading is being written — check back soon.</p>`;
  }
}

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   ════════════════════════════════════════════════════════════════════ */

const fields = FormKit.render(document.getElementById('calc-form'), 'name', {
  name: { label: 'Full birth name', placeholder: 'e.g. John Michael Smith' },
});
const nameInput = document.getElementById('name');
const container = document.querySelector('.destiny-container');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');

function validate(name) {
  const nameValid = /^[a-zа-яё\- ]*$/i;
  if (!name.replace(/[^a-zA-Z]/g, '')) {
    return `<p>Enter a name using letters only (spaces and dashes are fine).</p>`;
  }
  if (!nameValid.test(name)) {
    return `<p>Name format is incorrect: allowed characters are letters, dash and space. Example: John Michael Smith.</p>`;
  }
  return true;
}

function runCalculation(name, { updateUrl = true } = {}) {
  const response = validate(name);

  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  if (response !== true) {
    errorOutput.innerHTML = response;
    container.classList.add('display-none');
    return;
  }

  outputDate.textContent = `${titleCase(name)}'s Destiny Number`;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });

  calculateAndRender(name);

  // Same page, no reload — just swap the shareable URL in place.
  if (updateUrl) {
    FormKit.updateUrlParams(fields, { name });
  }
}

FormKit.wire(fields, {
  onSubmit: (values) => runCalculation(values.name),
});

// If the page is opened with ?name=... (a shared link), fill the
// input and calculate immediately — no click required.
FormKit.prefillFromUrl(fields, (values) => runCalculation(values.name, { updateUrl: false }));

</script>
</body>
</html>
