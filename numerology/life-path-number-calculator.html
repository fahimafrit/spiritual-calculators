<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life Path Number Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../assets/css/numerology/base.css" />
</head>

<body>

<div class="container">
  <h1 class="page-title">Life Path Number Calculator</h1>
  <p class="page-subtitle">Discover the road your soul is walking</p>

  <div class="form-card">
    <div class="field">
      <label for="date">Date of birth</label>
      <input id="date" type="text" placeholder="dd/mm/yyyy" maxlength="10" autocomplete="off" inputmode="numeric" />
    </div>
    <button id="submit-btn">Calculate</button>
  </div>
  <div class="error-output"></div>

  <div class="result-wrap lifepath-container display-none">
    <div class="result-card">
      <div class="output-personal-date"></div>
      <hr class="section-divider" />

      <h2 class="section-title tight">Your Life Path Number</h2>
      <div class="result-number-display">
        <p class="num-value" id="num-value"></p>
      </div>
      <hr class="section-divider" />

      <h2 class="section-title">Calculation Process</h2>
      <div class="process-card" id="process-lines"></div>
      <hr class="section-divider" />

      <h2 class="section-title">What Your Life Path Number Means</h2>
      <div class="interpretation-card" id="interpretation"></div>
    </div>
  </div>
</div>

<script src="../assets/js/numerology/calculations.js"></script>
<script src="../assets/js/numerology/life-path-number-data.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   CALCULATION PROCESS RENDER
   Plain-text, line-by-line reduction chains for day / month / year,
   then their sum reduced to the final Life Path Number.
   ════════════════════════════════════════════════════════════════════ */

function processLine(label, raw, steps, { finalLine = false } = {}) {
  const inner = `<span class="process-label">${label}:</span> ${raw} <span class="process-arrow">&#8594;</span> ${steps.join(' <span class="process-arrow">&#8594;</span> ')}`;
  return `<p class="process-line${finalLine ? ' process-final' : ''}">${inner}</p>`;
}

function calculateAndRender(day, month, year) {
  const daySteps = reduceKeepingMasterWithSteps(day);
  const monthSteps = reduceKeepingMasterWithSteps(month);
  const yearSteps = reduceKeepingMasterWithSteps(year);

  const dayFinal = daySteps[daySteps.length - 1];
  const monthFinal = monthSteps[monthSteps.length - 1];
  const yearFinal = yearSteps[yearSteps.length - 1];

  const total = dayFinal + monthFinal + yearFinal;
  const totalSteps = reduceKeepingMasterWithSteps(total);
  const lifePathNumber = totalSteps[totalSteps.length - 1];

  const lines = [
    processLine('Birth Day', day, daySteps),
    processLine('Birth Month', month, monthSteps),
    processLine('Birth Year', year, yearSteps),
    `<p class="process-line"><span class="process-label">Sum:</span> ${dayFinal} + ${monthFinal} + ${yearFinal} = ${total} <span class="process-arrow">&#8594;</span> ${totalSteps.join(' <span class="process-arrow">&#8594;</span> ')}</p>`,
    `<p class="process-line process-final">Life Path Number: ${formatDisplayNumber(lifePathNumber)}</p>`,
  ];
  document.getElementById('process-lines').innerHTML = lines.join('');

  document.getElementById('num-value').textContent = formatDisplayNumber(lifePathNumber);

  const entry = LIFE_PATH_DATA[lifePathNumber];
  const interpEl = document.getElementById('interpretation');
  if (entry) {
    interpEl.innerHTML = `<p><strong>${escapeHtml(entry.title)}</strong></p>` +
      entry.paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join('');
  } else {
    interpEl.innerHTML = `<p>This reading is being written — check back soon.</p>`;
  }
}

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   ════════════════════════════════════════════════════════════════════ */

const dateInput = document.getElementById('date');
const container = document.querySelector('.lifepath-container');
const btnAnswer = document.getElementById('submit-btn');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');

dateInput.addEventListener('input', maskDateInput);

function validate(date, parsed, dateIsValid) {
  let errorMessage = '';
  const today = new Date();

  if (!parsed || !dateIsValid) {
    errorMessage += `<p>Date is not valid. Use dd/mm/yyyy.</p>`;
  }
  if (parsed && dateIsValid && (date > today)) {
    errorMessage += `<p>Date can't be in the future.</p>`;
  }
  return errorMessage !== '' ? errorMessage : true;
}

function runCalculation(calculationDate, { updateUrl = true } = {}) {
  const parsed = parseDdMmYyyy(calculationDate);
  const date = parsed ? new Date(parsed.year, parsed.month - 1, parsed.day) : new Date(NaN);
  const dateIsValid = isValidCalendarDate(parsed, date);
  const response = validate(date, parsed, dateIsValid);

  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  if (response !== true) {
    errorOutput.innerHTML = response;
    container.classList.add('display-none');
    return;
  }

  outputDate.textContent = `Date of Birth: ${formatLongDate(parsed.day, parsed.month, parsed.year)}`;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });

  calculateAndRender(parsed.day, parsed.month, parsed.year);

  // Same page, no reload — just swap the shareable URL in place.
  // Everything is recalculated client-side, nothing is stored server-side.
  if (updateUrl) {
    const url = new URL(window.location.href);
    url.searchParams.set('dob', calculationDate.replace(/\//g, '-'));
    window.history.pushState({}, '', url);
  }
}

btnAnswer.addEventListener('click', (evt) => {
  evt.preventDefault();
  runCalculation(dateInput.value);
});

dateInput.addEventListener('keydown', (evt) => {
  if (evt.key === 'Enter') btnAnswer.click();
});

// If the page is opened with ?dob=DD-MM-YYYY (a shared link), fill the
// input and calculate immediately — no click required.
(function calculateFromUrlIfPresent() {
  const params = new URLSearchParams(window.location.search);
  const dFromUrl = params.get('dob');
  if (dFromUrl) {
    const dobFromUrl = dFromUrl.replace(/-/g, '/');
    dateInput.value = dobFromUrl;
    runCalculation(dobFromUrl, { updateUrl: false });
  }
})();
</script>
</body>
</html>
