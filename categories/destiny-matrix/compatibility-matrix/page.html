<style>
  /* Page-specific styles (not shared with other calculators) */


  /* ── Tabs ───────────────────────────────────────────── */
  .tabs-row{
    display:flex; justify-content:center; gap:10px; margin-bottom:28px; flex-wrap:wrap;
  }


  .tab-btn{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:999px;
    padding:10px 22px; font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
    letter-spacing:0.03em; color:var(--ink); cursor:pointer; transition:transform .15s, box-shadow .15s, background .15s, color .15s;
    text-transform:uppercase;
  }


  .tab-btn:hover{transform:translateY(-1px); box-shadow:0 8px 18px rgba(36,26,68,0.10);}


  .tab-btn.active{
    background:linear-gradient(135deg,var(--gold-bright),var(--gold)); color:#ffffff; border-color:transparent;
  }



  /* ── Octagram ───────────────────────────────────────── */
  .octagram-section{}


  @media (max-width: 420px){
    .tabs-row{ gap:8px; margin-bottom:22px; }
    .tab-btn{ padding:9px 16px; font-size:12.5px; }
  }
</style>

<script src="../../../assets/js/core/forms.js"></script>
<script src="../../../assets/js/destiny-matrix/ui-effects.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   All calculation and validation logic lives server-side
   (calculate.php?slug=compatibility-matrix). This page
   only submits the two dates and renders what the endpoint returns.
   ════════════════════════════════════════════════════════════════════ */

function renderValues(values) {
  for (const [key, value] of Object.entries(values)) {
    const el = document.getElementById(key);
    if (el) el.textContent = value;
  }
}

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   ════════════════════════════════════════════════════════════════════ */

const fields = FormKit.render(document.getElementById('calc-form'), 'two-dob', {
  submitLabel: 'Create compatibility chart',
});
const date1Input = document.getElementById('date1');
const date2Input = document.getElementById('date2');
const container = document.querySelector('.matrix-container');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');
const purposesCard = document.getElementById('purposes-card');
const tabButtons = document.querySelectorAll('.tab-btn');

// Ids of the SVG groups/points that only belong to a full 32-point personal
// matrix and have no place in the 20-point compatibility matrix.
const PERSONAL_ONLY_GROUP_IDS = ['points-aux', 'points-years', 'age-tick-dots', 'pt-w', 'pt-x'];

// Every id the chart can populate, so a tab switch can blank the whole
// chart before drawing the next tab's values.
const ALL_POINT_IDS = ['apoint','bpoint','cpoint','dpoint','epoint','fpoint','gpoint','hpoint','ipoint',
  'jpoint','kpoint','lpoint','mpoint','npoint','opoint','ppoint','qpoint','rpoint','spoint','tpoint',
  'upoint','vpoint','wpoint','xpoint','f2point','f1point','g2point','g1point','i2point','i1point','h2point','h1point',
  'afpoint','af1point','af2point','af3point','af4point','af5point','af6point',
  'fbpoint','fb1point','fb2point','fb3point','fb4point','fb5point','fb6point',
  'bgpoint','bg1point','bg2point','bg3point','bg4point','bg5point','bg6point',
  'gcpoint','gc1point','gc2point','gc3point','gc4point','gc5point','gc6point',
  'cipoint','ci1point','ci2point','ci3point','ci4point','ci5point','ci6point',
  'idpoint','id1point','id2point','id3point','id4point','id5point','id6point',
  'dhpoint','dh1point','dh2point','dh3point','dh4point','dh5point','dh6point',
  'hapoint','ha1point','ha2point','ha3point','ha4point','ha5point','ha6point',
  'skypoint','earthpoint','perspurpose','femalepoint','malepoint','socialpurpose','generalpurpose','planetarypurpose'];

let activeTab = 'compat';
let results = null; // { compat: {...}, p1: {...}, p2: {...} } as returned by the server

// Bumped on every calculation so a slow, older response can never
// overwrite the result of a newer one.
let latestCalculationId = 0;

/* Purpose blocks: heading, text, and diagram/circle reveal in their
   own sequence on first appearance — never the whole block at once. */
(function revealPurposeBlocks() {
  let i = 0;
  document.querySelectorAll('.purpose-block').forEach((block) => {
    const parts = [
      block.querySelector('h3'),
      block.querySelector('.purpose-desc'),
      block.querySelector('.purpose-diagram, .base-circle'),
    ];
    parts.forEach((el) => {
      if (!el) return;
      el.setAttribute('data-reveal', '');
      el.style.setProperty('--reveal-delay', (i * 0.09).toFixed(2) + 's');
      i += 1;
    });
  });
})();

// Date masking, focus-advance between date1/date2 (and on to the
// submit button after date2), and the Partner-1/Partner-2 focus-
// placeholder swap are all wired below via FormKit.wire().

function clearAllOutputs() {
  ALL_POINT_IDS.forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.textContent = '';
  });
}

function setSvgGroupsVisible(visible) {
  PERSONAL_ONLY_GROUP_IDS.forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('display-none', !visible);
  });
}

function renderTab(tab) {
  activeTab = tab;
  tabButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === tab));

  if (!results) return;

  clearAllOutputs();

  if (tab === 'compat') {
    setSvgGroupsVisible(false);
    purposesCard.classList.remove('display-none');
    renderValues(results.compat);
  } else {
    setSvgGroupsVisible(true);
    purposesCard.classList.remove('display-none');
    renderValues(tab === 'p1' ? results.p1 : results.p2);
  }

  // Content updates in place rather than being freshly inserted, so
  // retrigger the fade manually on each tab switch.
  UIEffects.retrigger(document.querySelector('.octagram-section'), 'tab-fade');
  UIEffects.retrigger(purposesCard, 'tab-fade');
}

tabButtons.forEach((btn) => {
  btn.addEventListener('click', () => renderTab(btn.dataset.tab));
});

async function runCalculation(calcDate1, calcDate2, { updateUrl = true } = {}) {
  const calculationId = ++latestCalculationId;

  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  let data;
  try {
    const res = await fetch('../../../calculate.php?slug=compatibility-matrix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'date1=' + encodeURIComponent(calcDate1) + '&date2=' + encodeURIComponent(calcDate2),
    });
    data = await res.json();
  } catch (err) {
    if (calculationId !== latestCalculationId) return;
    errorOutput.innerHTML = '<p>Something went wrong. Please try again.</p>';
    container.classList.add('display-none');
    return;
  }

  if (calculationId !== latestCalculationId) return;

  if (!data.valid) {
    errorOutput.innerHTML = data.errorsHtml;
    container.classList.add('display-none');
    return;
  }

  results = { compat: data.compat, p1: data.p1, p2: data.p2 };

  outputDate.innerHTML = data.headerHtml;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });
  UIEffects.revealOnScroll();

  renderTab('compat');

  // Same page, no reload/new page — just swap the shareable URL in place.
  if (updateUrl) {
    FormKit.updateUrlParams(fields, { date1: calcDate1, date2: calcDate2 });
  }

  date1Input.value = '';
  date2Input.value = '';
}

FormKit.wire(fields, {
  onSubmit: (values) => runCalculation(values.date1, values.date2),
});

// If the page is opened with ?dob1=DD-MM-YYYY&dob2=DD-MM-YYYY in the URL
// (e.g. a shared link), fill the inputs and calculate immediately.
FormKit.prefillFromUrl(fields, (values) =>
  runCalculation(values.date1, values.date2, { updateUrl: false })
);

</script>
