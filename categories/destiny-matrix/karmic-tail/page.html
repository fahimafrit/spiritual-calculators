<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karmic Tail Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  /* ── Karmic tail highlight on the octagram ─────────────────────── */
  .karmic-tail-spine{
    stroke: var(--gold-bright);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.55;
  }

  .karmic-tail-glow{
    fill: rgba(169, 120, 47, 0.12);
    stroke: var(--gold-bright);
    stroke-width: 1.4;
    stroke-dasharray: 3 3;
  }

  .karmic-tail-caption{
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: var(--gold);
    text-anchor: middle;
  }

  /* ── Result: three positions + shadow/integrated/practical ──────── */
  .karmic-card h2{ text-align:center; margin:0 0 4px; font-size:24px; color:var(--ink); }
  .karmic-card-sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px; }

  .karmic-triplet-badge{
    display:block; text-align:center; margin:0 0 28px;
  }
  .karmic-triplet-badge span{
    display:inline-block; padding:8px 18px; border-radius:999px;
    background: rgba(169,120,47,0.10); border:1px solid var(--gold);
    font-weight:800; letter-spacing:0.04em; color:var(--ink);
  }

  .karmic-position{
    border:1px solid var(--line-soft); border-radius:12px;
    padding:18px 20px; margin:0 0 14px;
    background: rgba(36,26,68,0.02);
  }
  .karmic-position:last-of-type{ margin-bottom: 24px; }

  .karmic-position-heading{
    font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--gold);
    margin:0 0 8px;
  }
  .karmic-position-heading .arcana-name{
    color: var(--ink); text-transform:none; letter-spacing:normal;
  }
  .karmic-position p{ margin:0; font-size:15px; line-height:1.65; color:var(--ink-soft); }

  .karmic-summary-grid{
    display:grid; grid-template-columns: 1fr; gap:14px;
  }
  .karmic-summary-block{
    border-radius:12px; padding:16px 18px;
  }
  .karmic-summary-block h3{
    margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:0.06em;
    font-family:'Nunito',sans-serif; font-weight:800;
  }
  .karmic-summary-block p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--ink-soft); }

  .karmic-summary-block.shadow{ background: rgba(192,57,43,0.06); }
  .karmic-summary-block.shadow h3{ color:#c0392b; }

  .karmic-summary-block.integrated{ background: rgba(63,159,106,0.08); }
  .karmic-summary-block.integrated h3{ color:#2e7d54; }

  .karmic-summary-block.practical{ background: rgba(91,111,214,0.07); }
  .karmic-summary-block.practical h3{ color:#4655b0; }

  .karmic-cta{
    margin-top:28px; text-align:center; padding:22px;
    border-radius:12px; background:linear-gradient(135deg,#fff8ec,#fdf1dc);
    border:1px solid var(--gold);
  }
  .karmic-cta p{ margin:0 0 12px; font-size:14.5px; color:var(--ink); }
  .karmic-cta a{
    display:inline-block; background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#ffffff; text-decoration:none; font-weight:800; font-size:14px;
    letter-spacing:0.03em; text-transform:uppercase; padding:12px 24px; border-radius:10px;
  }

  .karmic-status{ text-align:center; color:var(--ink-faint); font-size:14px; margin:0 0 16px; }
  .karmic-status:empty{ display:none; }


  @media (max-width: 420px){
    .karmic-position{ padding:14px 16px; }
    .karmic-cta{ padding:18px; }
    .karmic-triplet-badge span{ padding:7px 14px; font-size:14px; }
  }
</style>

<script src="../../../assets/js/core/forms.js"></script>
<script src="../../../assets/js/destiny-matrix/ui-effects.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   All calculation, validation and karmic tail lookup logic lives
   server-side (calculate.php?slug=karmic-tail). This page
   only submits the date and name and renders what the endpoint returns.
   ════════════════════════════════════════════════════════════════════ */

function renderValues(values) {
  for (const [key, value] of Object.entries(values)) {
    const el = document.getElementById(key);
    if (el) el.textContent = value;
  }
}

/* ════════════════════════════════════════════════════════════════════
   KARMIC TAIL CONTENT
   The endpoint returns the finished reading HTML for this one chart
   ('' when no reading exists for it yet). It is shown once its card is
   about to scroll into view.
   ════════════════════════════════════════════════════════════════════ */

function renderKarmicResult(readingHtml) {
  const resultEl = document.getElementById('karmic-result');
  const statusEl = document.getElementById('karmic-status');
  if (!resultEl) return;

  if (readingHtml === '') {
    resultEl.innerHTML = '';
    statusEl.textContent = 'Your karmic tail content is being written — check back soon.';
    return;
  }

  resultEl.innerHTML = readingHtml;
  statusEl.textContent = '';

  const traits = resultEl.querySelectorAll('.karmic-triplet-badge, .karmic-position');
  UIEffects.staggerReveal(traits, { from: 'translate(-28px, 18px)', step: 0.06 });

  const blocks = resultEl.querySelectorAll('.karmic-summary-block');
  UIEffects.staggerReveal(blocks, {
    from: 'translate(-28px, 18px)',
    step: 0.08,
    start: traits.length * 0.06 + 0.1,
  });
}

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   ════════════════════════════════════════════════════════════════════ */

const fields = FormKit.render(document.getElementById('calc-form'), 'dob-name', {
  submitLabel: 'Reveal my karmic tail',
});
const dateInput = document.getElementById('date');
const nameInput = document.getElementById('name');
const container = document.querySelector('.matrix-container');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');

// Bumped on every calculation so a slow, older response can never
// overwrite the result of a newer one.
let latestCalculationId = 0;

async function runCalculation(calculationDate, name, { updateUrl = true } = {}) {
  const calculationId = ++latestCalculationId;

  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  let data;
  try {
    const res = await fetch('../../../calculate.php?slug=karmic-tail', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'date=' + encodeURIComponent(calculationDate) + '&name=' + encodeURIComponent(name),
    });
    data = await res.json();
  } catch (err) {
    if (calculationId !== latestCalculationId) return;
    errorOutput.innerHTML = '<p>Something went wrong. Please try again.</p>';
    container.classList.add('display-none');
    return;
  }

  if (calculationId !== latestCalculationId) return;

  if (!data.valid) {
    errorOutput.innerHTML = data.errorsHtml;
    container.classList.add('display-none');
    return;
  }

  outputDate.innerHTML = data.headerHtml;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });
  UIEffects.revealOnScroll();

  renderValues(data.values);

  // Defer showing the karmic tail content until its card is actually
  // about to scroll into view.
  const karmicStatusEl = document.getElementById('karmic-status');
  if (karmicStatusEl) karmicStatusEl.textContent = '';
  document.getElementById('karmic-result').innerHTML =
    '<div class="lazy-skeleton"><div class="lazy-skeleton-line"></div><div class="lazy-skeleton-line short"></div></div>';
  UIEffects.lazyMount(document.querySelector('.karmic-card'), () => {
    if (calculationId === latestCalculationId) renderKarmicResult(data.readingHtml);
  });

  // Same page, no reload/new page — just swap the shareable URL in place.
  if (updateUrl) {
    FormKit.updateUrlParams(fields, { date: calculationDate, name });
  }

  dateInput.value = '';
  nameInput.value = '';
}

FormKit.wire(fields, {
  onSubmit: (values) => runCalculation(values.date, values.name),
});

// If the page is opened with ?dob=DD-MM-YYYY&name=... in the URL (e.g. a
// shared link), fill the inputs and calculate immediately — no click required.
FormKit.prefillFromUrl(fields, (values) => runCalculation(values.date, values.name, { updateUrl: false }));

</script>
