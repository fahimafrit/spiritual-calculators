<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attitude Number Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../../../assets/css/core/forms.css" />
<link rel="stylesheet" href="../../../assets/css/numerology/base.css" />
</head>

<body>

<div class="container">
  <div class="form-card" id="calc-form"></div>
  <div class="error-output"></div>

  <div class="result-wrap attitude-container display-none">
    <div class="result-card">
      <div class="output-personal-date"></div>
      <hr class="section-divider" />

      <h2 class="section-title tight">Your Attitude Number</h2>
      <div class="result-number-display">
        <p class="num-value" id="num-value"></p>
      </div>
      <hr class="section-divider" />

      <h2 class="section-title">Calculation Process</h2>
      <div class="process-card" id="process-lines"></div>
      <hr class="section-divider" />

      <h2 class="section-title">What Your Attitude Number Reveals</h2>
      <div class="interpretation-card" id="interpretation"></div>
    </div>
  </div>
</div>

<script src="../../../assets/js/core/forms.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   All calculation and interpretation logic lives server-side, reached
   through the dispatcher (calculate.php?slug=attitude-number). This
   page only submits the date and renders whatever HTML fragments the
   server returns.
   ════════════════════════════════════════════════════════════════════ */

const fields = FormKit.render(document.getElementById('calc-form'), 'dob');
const container = document.querySelector('.attitude-container');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');

async function runCalculation(calculationDate, { updateUrl = true } = {}) {
  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  let data;
  try {
    const res = await fetch('../../../calculate.php?slug=attitude-number', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'date=' + encodeURIComponent(calculationDate),
    });
    data = await res.json();
  } catch (err) {
    errorOutput.innerHTML = '<p>Something went wrong. Please try again.</p>';
    container.classList.add('display-none');
    return;
  }

  if (!data.valid) {
    errorOutput.innerHTML = data.errorsHtml;
    container.classList.add('display-none');
    return;
  }

  outputDate.textContent = data.headerText;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });

  document.getElementById('process-lines').innerHTML = data.processLinesHtml;
  document.getElementById('num-value').textContent = data.numValue;
  document.getElementById('interpretation').innerHTML = data.interpretationHtml;

  // Same page, no reload — just swap the shareable URL in place.
  if (updateUrl) {
    FormKit.updateUrlParams(fields, { date: calculationDate });
  }
}

FormKit.wire(fields, {
  onSubmit: (values) => runCalculation(values.date),
});

// If the page is opened with ?dob=DD-MM-YYYY (a shared link), fill the
// input and calculate immediately — no click required.
FormKit.prefillFromUrl(fields, (values) => runCalculation(values.date, { updateUrl: false }));

</script>
</body>
</html>
