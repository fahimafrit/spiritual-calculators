<!DOCTYPE html>
<html lang="en">
<head>

<style>
  /* ── Karmic tail highlight on the octagram ─────────────────────── */
  .karmic-tail-spine{
    stroke: var(--gold-bright);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.55;
  }

  .karmic-tail-glow{
    fill: rgba(169, 120, 47, 0.12);
    stroke: var(--gold-bright);
    stroke-width: 1.4;
    stroke-dasharray: 3 3;
  }

  .karmic-tail-caption{
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: var(--gold);
    text-anchor: middle;
  }

  /* ── Result: three positions + shadow/integrated/practical ──────── */
  .karmic-card h2{ text-align:center; margin:0 0 4px; font-size:24px; color:var(--ink); }
  .karmic-card-sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px; }

  .karmic-triplet-badge{
    display:block; text-align:center; margin:0 0 28px;
  }
  .karmic-triplet-badge span{
    display:inline-block; padding:8px 18px; border-radius:999px;
    background: rgba(169,120,47,0.10); border:1px solid var(--gold);
    font-weight:800; letter-spacing:0.04em; color:var(--ink);
  }

  .karmic-position{
    border:1px solid var(--line-soft); border-radius:12px;
    padding:18px 20px; margin:0 0 14px;
    background: rgba(36,26,68,0.02);
  }
  .karmic-position:last-of-type{ margin-bottom: 24px; }

  .karmic-position-heading{
    font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--gold);
    margin:0 0 8px;
  }
  .karmic-position-heading .arcana-name{
    color: var(--ink); text-transform:none; letter-spacing:normal;
  }
  .karmic-position p{ margin:0; font-size:15px; line-height:1.65; color:var(--ink-soft); }

  .karmic-summary-grid{
    display:grid; grid-template-columns: 1fr; gap:14px;
  }
  .karmic-summary-block{
    border-radius:12px; padding:16px 18px;
  }
  .karmic-summary-block h3{
    margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:0.06em;
    font-family:'Nunito',sans-serif; font-weight:800;
  }
  .karmic-summary-block p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--ink-soft); }

  .karmic-summary-block.shadow{ background: rgba(192,57,43,0.06); }
  .karmic-summary-block.shadow h3{ color:#c0392b; }

  .karmic-summary-block.integrated{ background: rgba(63,159,106,0.08); }
  .karmic-summary-block.integrated h3{ color:#2e7d54; }

  .karmic-summary-block.practical{ background: rgba(91,111,214,0.07); }
  .karmic-summary-block.practical h3{ color:#4655b0; }

  .karmic-cta{
    margin-top:28px; text-align:center; padding:22px;
    border-radius:12px; background:linear-gradient(135deg,#fff8ec,#fdf1dc);
    border:1px solid var(--gold);
  }
  .karmic-cta p{ margin:0 0 12px; font-size:14.5px; color:var(--ink); }
  .karmic-cta a{
    display:inline-block; background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#ffffff; text-decoration:none; font-weight:800; font-size:14px;
    letter-spacing:0.03em; text-transform:uppercase; padding:12px 24px; border-radius:10px;
  }

  .karmic-status{ text-align:center; color:var(--ink-faint); font-size:14px; margin:0 0 16px; }
  .karmic-status:empty{ display:none; }


  @media (max-width: 420px){
    .karmic-position{ padding:14px 16px; }
    .karmic-cta{ padding:18px; }
    .karmic-triplet-badge span{ padding:7px 14px; font-size:14px; }
  }

<script src="../assets/js/core/forms.js"></script>

<script>
'use strict';

function renderValues(values) {
  for (const [key, value] of Object.entries(values)) {
    const el = document.getElementById(key);
    if (el) el.textContent = value;
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ════════════════════════════════════════════════════════════════════
   KARMIC TAIL CONTENT — loads interpretations/karmic-manifest.json once,
   then looks up the entry matching jpoint-rpoint-dpoint.
   ════════════════════════════════════════════════════════════════════ */

const INTERPRETATIONS_BASE = 'data/karmic-tail-readings/';
let karmicEntriesPromise = null;

function loadKarmicEntries() {
  if (!karmicEntriesPromise) {
    karmicEntriesPromise = fetch(INTERPRETATIONS_BASE + 'karmic-manifest.json')
      .then((res) => {
        if (!res.ok) throw new Error(`Karmic tail content request failed: ${res.status}`);
        return res.json();
      });
  }
  return karmicEntriesPromise;
}

function renderKarmicPosition(position) {
  return `
    <div class="karmic-position">
      <p class="karmic-position-heading">${escapeHtml(position.roman)} &middot; <span class="arcana-name">${escapeHtml(position.arcana)}</span> — ${escapeHtml(position.role)}</p>
      <p>${escapeHtml(position.text)}</p>
    </div>`;
}

function renderKarmicEntry(entry) {
  const positionsHtml = entry.positions.map(renderKarmicPosition).join('');
  return `
    <div class="karmic-triplet-badge"><span>${escapeHtml(entry.name)}</span></div>
    ${positionsHtml}
    <div class="karmic-summary-grid">
      <div class="karmic-summary-block shadow">
        <h3>Shadow</h3>
        <p>${escapeHtml(entry.shadow)}</p>
      </div>
      <div class="karmic-summary-block integrated">
        <h3>Integrated</h3>
        <p>${escapeHtml(entry.integrated)}</p>
      </div>
      <div class="karmic-summary-block practical">
        <h3>Where It Shows Up</h3>
        <p>${escapeHtml(entry.practical)}</p>
      </div>
    </div>
    <div class="karmic-cta">
      <p>This is one thread. Your full Destiny Matrix reading maps how it connects to everything else in your chart.</p>
      <a href="../destiny-matrix/destiny-matrix.html" target="_blank">Get your full Destiny Matrix reading</a>
    </div>`;
}

async function renderKarmicResult(person) {
  const resultEl = document.getElementById('karmic-result');
  const statusEl = document.getElementById('karmic-status');
  if (!resultEl) return;

  resultEl.innerHTML = '';
  statusEl.textContent = 'Loading your karmic tail…';

  const cluster = `${person.points.jpoint}-${person.points.rpoint}-${person.points.dpoint}`;

  try {
    const entries = await loadKarmicEntries();
    const entry = entries.find((item) => item.cluster === cluster);
    if (!entry) {
      statusEl.textContent = 'Your karmic tail content is being written — check back soon.';
      return;
    }
    resultEl.innerHTML = renderKarmicEntry(entry);
    statusEl.textContent = '';

    const traits = resultEl.querySelectorAll('.karmic-triplet-badge, .karmic-position');
    UIEffects.staggerReveal(traits, { from: 'translate(-28px, 18px)', step: 0.06 });

    const blocks = resultEl.querySelectorAll('.karmic-summary-block');
    UIEffects.staggerReveal(blocks, {
      from: 'translate(-28px, 18px)',
      step: 0.08,
      start: traits.length * 0.06 + 0.1,
    });
  } catch (err) {
    console.warn('Could not load karmic tail content:', err);
    statusEl.textContent = 'Your karmic tail could not be loaded right now.';
  }
}

/* ════════════════════════════════════════════════════════════════════
   FORM / UI WIRING
   ════════════════════════════════════════════════════════════════════ */

const fields = FormKit.render(document.getElementById('calc-form'), 'dob-name', {
  submitLabel: 'Reveal my karmic tail',
});
const dateInput = document.getElementById('date');
const nameInput = document.getElementById('name');
const container = document.querySelector('.matrix-container');
const errorOutput = document.querySelector('.error-output');
const outputDate = document.querySelector('.output-personal-date');

function titleCase(str) {
  return str.replace(/\S+/g, (word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
}

const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function formatLongDate(day, month, year) {
  return `${day} ${MONTH_NAMES[month - 1]} ${year}`;
}

function parseDdMmYyyy(value) {
  const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
  if (!match) return null;
  const [, dd, mm, yyyy] = match;
  return { day: +dd, month: +mm, year: +yyyy };
}

function validate(date, name, parsed, dateIsValid) {
  let errorMessage = '';
  const today = new Date();
  const nameValid = new RegExp('^[а-яё\\- ]*[a-z\\- ]*$', 'i');

  if (name === '' || !parsed || !dateIsValid) {
    errorMessage += `<p>Date is not valid or one of the fields is empty. Use dd/mm/yyyy.</p>`;
  }
  if (parsed && dateIsValid && (date > today)) {
    errorMessage += `<p>Date can't be in the future.</p>`;
  }
  if (!nameValid.test(name)) {
    errorMessage += `<p>Name format is incorrect: allowed characters are letters, dash and space. Example: Anna, Anna-Maria, Anna Maria.</p>`;
  }
  return errorMessage !== '' ? errorMessage : true;
}

function runCalculation(calculationDate, name, { updateUrl = true } = {}) {
  const parsed = parseDdMmYyyy(calculationDate);
  const date = parsed ? new Date(parsed.year, parsed.month - 1, parsed.day) : new Date(NaN);
  const dateIsValid = isValidCalendarDate(parsed, date);
  const response = validate(date, name, parsed, dateIsValid);

  outputDate.innerHTML = '';
  errorOutput.innerHTML = '';

  if (response !== true) {
    errorOutput.innerHTML = response;
    container.classList.add('display-none');
    return;
  }

  const fullDate = formatLongDate(parsed.day, parsed.month, parsed.year);
  outputDate.innerHTML = `${titleCase(name)}'s <span class="gray">Karmic Tail — Date of Birth: ${fullDate}</span>`;

  container.classList.remove('display-none');
  container.scrollIntoView({ behavior: 'smooth' });
  UIEffects.revealOnScroll();

  const apoint = reduceNumber(parsed.day);
  const bpoint = parsed.month;
  const cpoint = calculateYear(parsed.year);

  const person = calculatePoints(apoint, bpoint, cpoint);

  renderValues(person.points);

  // Defer the karmic tail content fetch/render until its card is
  // actually about to scroll into view.
  const karmicStatusEl = document.getElementById('karmic-status');
  if (karmicStatusEl) karmicStatusEl.textContent = '';
  document.getElementById('karmic-result').innerHTML =
    '<div class="lazy-skeleton"><div class="lazy-skeleton-line"></div><div class="lazy-skeleton-line short"></div></div>';
  UIEffects.lazyMount(document.querySelector('.karmic-card'), () => renderKarmicResult(person));

  // Same page, no reload/new page — just swap the shareable URL in place.
  // Everything is recalculated client-side from the URL, nothing is stored server-side.
  if (updateUrl) {
    FormKit.updateUrlParams(fields, { date: calculationDate, name });
  }

  dateInput.value = '';
  nameInput.value = '';
}

FormKit.wire(fields, {
  onSubmit: (values) => runCalculation(values.date, values.name),
});

// If the page is opened with ?dob=DD-MM-YYYY&name=... in the URL (e.g. a
// shared link), fill the inputs and calculate immediately — no click required.
FormKit.prefillFromUrl(fields, (values) => runCalculation(values.date, values.name, { updateUrl: false }));

</script>
